[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-video-editor"
version = "0.1.0"
description = "IncuBrix Prompt-Based Video Editing Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jsonschema>=4.22.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*", "nlu*", "perception*", "cli*"]
exclude = ["web*", "tests*", "outputs*", "media*", "docs*", "intent_cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["engine", "nlu", "media", "api", "cli"]
omit = ["tests/*", "*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
